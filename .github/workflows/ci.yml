name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Build, integration, deployed smoke and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked Brain dependencies and quality tools
        run: |
          pipx install poetry==2.4.3
          poetry -C src/brain install --no-interaction
          src/brain/.venv/bin/python -m pip install -r scripts/requirements-quality.txt
      - name: Select comparison base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          echo "QUALITY_BASE=$base" >> "$GITHUB_ENV"
      - name: Run the same quality command as local development
        run: src/brain/.venv/bin/python scripts/quality.py --base "$QUALITY_BASE"
      - name: Publish evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.sha }}
          path: |
            reports/
            src/core/coverage.out
          if-no-files-found: error
      - name: Clean up disposable services
        if: always()
        run: docker compose -f deploy/docker-compose.quality.yml down --volumes
