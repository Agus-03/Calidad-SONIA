# SONIA - the 22 enumerations. Source of truth: DER/entidades.md; this is its transcription.

version: 1

enums:
  ContactType:
    db_type: contact_type
    origin: Anexo C — contacts.type
    values: [client, provider, prospect]

  OperatorRole:
    db_type: operator_role
    origin: Anexo B (C01)
    values: [operator, supervisor, admin]

  AgentMode:
    db_type: agent_mode
    origin: Anexo C; F02, F27
    # Quoted: YAML 1.1 reads off/on/yes/no as booleans.
    values: [autonomous, suggestion, "off"]

  ConversationStatus:
    db_type: conversation_status
    origin: Anexo C — conversations.status
    values: [active, waiting, resolved]

  MessageDirection:
    db_type: message_direction
    origin: Anexo C — messages.direction
    values: [inbound, outbound]

  MessageContentType:
    db_type: message_content_type
    origin: Anexo C — messages.content_type
    values: [text, audio, image]

  SenderType:
    db_type: sender_type
    origin: H-09
    values: [contact, ai_agent, operator, system]

  MessageStatus:
    db_type: message_status
    origin: F20 - channel status webhooks
    values: [sent, delivered, read, failed]

  SourceChannel:
    db_type: source_channel
    origin: F15; ADR-0001
    values: [meta_ads, qr, referral, direct]

  PromptComponentType:
    db_type: prompt_component_type
    origin: F01 - the six components
    # This order is F01's and it is the default on creation; position is mutable and does not version.
    values: [objective, personality, behavior, tone, brand_voice, rules]

  TransferSignalType:
    db_type: transfer_signal_type
    origin: F12
    values: [no_resolution, frustration, out_of_domain, explicit_request]

  BatchCloseReason:
    db_type: batch_close_reason
    origin: F10
    values: [silence, max_messages, max_duration]

  PipelineStep:
    db_type: pipeline_step
    origin: ADR-0016
    # Fixed before the pipeline was drawn (Paso 8): it is expected to change.
    values: [blocklist, guardrail, triage, retrieval, reranking, grounding, generation]

  GenerationStatus:
    db_type: generation_status
    origin: F02; blocked added by ADR-0016 (Paso 8)
    # Describe el FILTRADO, no la entrega. La entrega vive en MessageStatus.
    values: [auto_sent, pending_review, accepted, edited, rejected, blocked]

  DocumentStatus:
    db_type: document_status
    origin: ADR-0005
    values: [pending, processing, indexed, failed]

  MetaTemplateStatus:
    db_type: meta_template_status
    origin: F08, F37
    values: [approved, pending, rejected]

  AttributeSource:
    db_type: attribute_source
    origin: F31
    values: [manual, llm]

  AnnotationType:
    db_type: annotation_type
    origin: OE3, OE4
    values: [transfer, frustration, intent]

  WebhookEventType:
    db_type: webhook_event_type
    origin: F20, section 8.5
    values: [message, status, unknown]

  WebhookEventStatus:
    db_type: webhook_event_status
    origin: F20
    values: [received, processed, failed, discarded]

  InboxStatus:
    db_type: inbox_status
    origin: F20
    values: [active, inactive, error]

  MetaTemplateCategory:
    db_type: meta_template_category
    origin: F08, F37 - the set is fixed by Meta
    values: [marketing, utility, authentication]
