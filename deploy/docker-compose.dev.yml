# Development tooling, kept out of docker-compose.yml so the three deployables of ADR-0017 stay three.

services:
  pgadmin:
    image: dpage/pgadmin4:9.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?}
      # Desktop mode: there is one person on the other side and a login screen would only be a second password to remember.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # The PostgreSQL MCP server that .mcp.json points at: it lives here so it can only ever see the development database.
  dbhub:
    image: bytebase/dbhub:1.2.3
    init: true
    command: ["--transport", "http", "--port", "8080", "--config", "/etc/dbhub/dbhub.toml"]
    ports:
      # Loopback only, like db: the MCP answers raw SQL with no auth token, so nothing off this machine should reach it.
      - "127.0.0.1:8090:8080"
    configs:
      - source: dbhub_config
        target: /etc/dbhub/dbhub.toml
    depends_on:
      db:
        condition: service_healthy

# Inline and not a file, because this is the only way the real POSTGRES_* of the .env reach servers.json.
configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "SONIA",
            "Group": "Servers",
            "Host": "db",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB}",
            "Username": "${POSTGRES_USER}",
            "SSLMode": "prefer"
          }
        }
      }

  # Read-only is a TOML-only setting in DBHub, and listing [[tools]] enables only what is listed, so both tools are named.
  dbhub_config:
    content: |
      [[sources]]
      id = "sonia"
      dsn = "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      query_timeout = 30

      # The role is the superuser of the dev database, so this guard is the only thing standing between a prompt and a DELETE.
      [[tools]]
      name = "execute_sql"
      source = "sonia"
      readonly = true
      # Every row comes back into the model's context: a bounded answer keeps one careless SELECT from eating the window.
      max_rows = 200

      [[tools]]
      name = "search_objects"
      source = "sonia"

volumes:
  pgadmin:
