# Disposable environment for CI and local verification. These credentials are test fixtures.
name: sonia-quality
x-shared: &shared
  ENVIRONMENT: test
  LOG_LEVEL: warning
  DATABASE_URL: postgresql://sonia:sonia_test_password@db:5432/sonia_test
  DB_POOL_MIN_SIZE: "1"
  DB_POOL_MAX_SIZE: "10"
  BRAIN_INTERNAL_TOKEN: quality-internal-token
  QDRANT_URL: http://qdrant:6333
  LLM_USE_DOUBLE: "true"
  EMBEDDINGS_USE_DOUBLE: "true"
  FIREBASE_STORAGE_BUCKET: sonia-smoke
  STORAGE_EMULATOR_HOST: http://storage:4443
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonia_test
      POSTGRES_USER: sonia
      POSTGRES_PASSWORD: sonia_test_password
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonia -d sonia_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["127.0.0.1:56333:6333"]
  storage:
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "memory", "-public-host", "storage:4443"]
    ports: ["127.0.0.1:54443:4443"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4443/_internal/healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
  core:
    build:
      context: ..
      dockerfile: deploy/core.Dockerfile
    environment:
      <<: *shared
      CORE_HTTP_ADDR: ":8080"
      BRAIN_BASE_URL: http://brain:8000
      JWT_SECRET: quality-only-jwt-secret-at-least-32-bytes
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DOCUMENT_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      WHATSAPP_USE_DOUBLE: "true"
      TURN_BATCH_WINDOW_MS: "100"
      TURN_POLL_INTERVAL_MS: "100"
    ports: ["127.0.0.1:58080:8080"]
    depends_on:
      db: {condition: service_healthy}
      storage: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 60
  brain:
    build:
      context: ..
      dockerfile: deploy/brain.Dockerfile
    environment:
      <<: *shared
      BRAIN_HTTP_HOST: 0.0.0.0
      BRAIN_HTTP_PORT: "8000"
    ports: ["127.0.0.1:58000:8000"]
    depends_on:
      db: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 60
  worker:
    build:
      context: ..
      dockerfile: deploy/brain.Dockerfile
    command: ["python", "main.py", "worker"]
    environment:
      <<: *shared
      DOCUMENT_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      WORKER_POLL_INTERVAL_SECONDS: "1"
    depends_on:
      core: {condition: service_healthy}
      qdrant: {condition: service_started}
