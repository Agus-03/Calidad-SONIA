# The words the AIAgent may not answer with (decision O6b), in a file of their own and not inside the outbound section of
# blocklist.yaml. Two files because they have two owners: that one is the policy of whoever runs the business, which decision D4
# ships empty on purpose, and this one is a guard the team keeps loading, because an insult in an answer is a legal exposure and
# not a matter of taste.
#
# THIS IS THE FILE TO LOAD WORDS INTO. One entry per line, and one line per variant: the comparison is by whole word with case and
# accents folded (pipeline/blocklist.py), so "puta" does not cover "putas", while "PUTA" and "putá" are already covered by the one
# below. An entry may hold more than one word. The order only decides which entry a blocked turn reports.
#
# IT IS THAT WORD AND NOT A PIECE OF ANOTHER, which is what makes a short entry safe: "culo" does not fire on "músculo" nor on
# "vínculo", and it does fire on "¡CULO!" and on "ese culo." because punctuation is not a letter. The price of that exactness is
# the line above — "culos", "culón" and "culito" are other words, and each one needs its own line here.
#
# WHAT IT COSTS TO ADD ONE, so nobody has to discover it in production: a match ends the turn when the generation has already been
# paid for, the customer is left with no answer at all, and the conversation waits for a person. So an ambiguous word does not
# filter an insult, it gags the AIAgent until somebody deploys again — "forro" is an insult and also the lining of a jacket,
# "retrasado" is an insult and also a late payment. Those do not belong here, and tests/test_blocklist.py refuses a handful of
# them by answering ordinary sentences of a rental business through this list.
#
# BUMP THE VERSION BELOW WHEN THE LIST CHANGES. pipeline_steps.version writes it, so a word added without it leaves every earlier
# row of this step naming a list that no longer exists — the same argument signal_evaluations.classifier_version exists for.
#
# And the part that has to be said out loud: these words are ours and not the anteproyecto's, which declares none. They are a seed
# for O6b, chosen because they insult in every use, and not a requirement of anybody's.
version: 1

# Only the outbound run reads this list. Blocking what the customer writes would leave them with no answer for having sworn, and
# what O6b is about is the AIAgent not being the one who swears.
terms:
  - hijo de puta
  - hija de puta
  - hijos de puta
  - hijas de puta
  - puta
  - putas
  - puto
  - putos
  - pelotudo
  - pelotuda
  - pelotudos
  - pelotudas
  - imbécil
  - imbéciles
  - idiota
  - idiotas
  - tarado
  - tarada
  - mierda
  - sorete
  - conchudo
  - conchuda
  - mogólico
  - mogólica
